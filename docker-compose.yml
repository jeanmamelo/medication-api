services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: medications
      POSTGRES_USER: medications
      POSTGRES_PASSWORD: medications
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medications -d medications"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs the same binary as the production Pre-Deploy Command, so local development
  # exercises the real migration path instead of docker-entrypoint-initdb.d.
  migrate:
    build: .
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://medications:medications@db:5432/medications?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://medications:medications@db:5432/medications?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
